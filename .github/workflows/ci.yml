# Validates app folders on human-opened PRs and pushes.
# Note: PRs opened by the factory (via GITHUB_TOKEN) don't trigger this workflow,
# which is why factory-build.yml runs the same validation before opening the PR.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-apps.mjs
      - run: node scripts/build-site.mjs
